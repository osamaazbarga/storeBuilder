
# Nginx reverse proxy config for local development
# Redirects *.localtest.me:80 → Angular dev server on :4200
# Place this file in nginx/conf/ and run nginx

events {
    worker_connections 1024;
}

http {
    # Forward all *.localtest.me subdomains to Angular dev server
    server {
        listen 80;
        server_name *.localtest.me localtest.me;

        location / {
            proxy_pass http://127.0.0.1:4200;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (needed for Angular HMR live reload)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
