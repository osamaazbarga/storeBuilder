<section class="content-area" dir="rtl">
    <header class="page-header">
      <h1 class="title">اكتشف باقات سلة</h1>
      <p class="subtitle">اختر الباقة المناسبة لاحتياجاتك، ويمكنك تغييرها لاحقًا.</p>
    </header>

    <div class="plans-grid">
      <div class="plan-card" [class.featured]="selectedPlan === 'basic'">
        <div class="plan-header">سلة بيسك</div>
        <div class="plan-price">مجانا</div>
        <ul class="plan-features">
          <li>منتجات غير محدودة</li>
          <li>دعم أساسي</li>
          <li>طرق دفع متعددة</li>
        </ul>
        <button 
          class="btn-primary" 
          [class.btn-secondary]="selectedPlan !== 'free'"
          [class.btn-primary]="selectedPlan === 'free'"
          (click)="selectPlan('free', 'سلة بيسك', 'مجانا')">
          {{ selectedPlan === 'free' ? '✓ مختارة' : 'اختر الباقة' }}
        </button>
      </div>

      <div class="plan-card" [class.featured]="selectedPlan === 'basic'">
        <div class="plan-header">سلة بلس</div>
        <div class="plan-price">990 ر.س / سنوياً</div>
        <ul class="plan-features">
          <li>ميزات إضافية</li>
          <li>تقارير متقدمة</li>
          <li>دعم أسرع</li>
        </ul>
        <button 
          class="btn-secondary" 
          [class.btn-primary]="selectedPlan === 'basic'"
          [class.btn-secondary]="selectedPlan !== 'basic'"
          (click)="selectPlan('basic', 'سلة بلس', '990 ر.س / سنوياً')">
          {{ selectedPlan === 'basic' ? '✓ مختارة' : 'اختر الباقة' }}
        </button>
      </div>

      <div class="plan-card" [class.featured]="selectedPlan === 'pro'">
        <div class="plan-header">سلة برو</div>
        <div class="plan-price">2990 ر.س / سنوياً</div>
        <ul class="plan-features">
          <li>كل الميزات</li>
          <li>دعم أولوية</li>
          <li>تكاملات متقدمة</li>
        </ul>
        <button 
          class="btn-secondary" 
          [class.btn-primary]="selectedPlan === 'pro'"
          [class.btn-secondary]="selectedPlan !== 'pro'"
          (click)="selectPlan('pro', 'سلة برو', '2990 ر.س / سنوياً')">
          {{ selectedPlan === 'pro' ? '✓ مختارة' : 'اختر الباقة' }}
        </button>
      </div>
    </div>

    <div class="actions">
      <button class="btn-secondary" (click)="back()">السابق</button>
      <button 
        class="btn-primary" 
        [disabled]="!selectedPlan"
        (click)="createStore()">
        إضافة متجر
      </button>
    </div>
  </section>
