<aside class="steps-aside">
  <div class="brand-box">
    <div class="brand-mark"></div>
    <div class="brand-text">سلة</div>
  </div>
  <ol class="steps-list">
    <li 
      *ngFor="let step of steps"
      class="step-item" 
      [class.active]="isActive(step.segment)"
      [class.completed]="isCompleted(step.number)"
      [class.disabled]="!canNavigateTo(step.number)"
      (click)="navigateToStep(step.number)">
      <span class="step-index" [class.completed]="isCompleted(step.number)">
        <span *ngIf="!isCompleted(step.number)">{{ step.number }}</span>
        <span *ngIf="isCompleted(step.number)">✓</span>
      </span>
      <span class="step-label">{{ step.label }}</span>
    </li>
  </ol>
</aside>
