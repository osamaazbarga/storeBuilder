<mat-card class="step-card" style="text-align: right">
  <mat-card-header>
    <mat-card-title-group class="title">
      <mat-card-title aria-level="1">فعّل المدفوعات الإلكترونية</mat-card-title>
      <mat-card-subtitle aria-level="2">اختر وسائل الدفع المناسبة لمتجرك</mat-card-subtitle>
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-content class="payments">
    <div class="method" *ngFor="let m of methods">
      <span>{{ m.label }}</span>
      <mat-slide-toggle [(ngModel)]="enabled[m.key]"></mat-slide-toggle>
    </div>
  </mat-card-content>
</mat-card>
