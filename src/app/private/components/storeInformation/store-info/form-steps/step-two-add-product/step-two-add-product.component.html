<mat-card class="step-card" style="text-align: right">
  <mat-card-header>
    <mat-card-title-group class="title">
      <mat-card-title aria-level="1">أضف أول منتج</mat-card-title>
      <mat-card-subtitle aria-level="2">أدخل معلومات منتجك الأول لبدء المتجر</mat-card-subtitle>
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-content class="product-form">
    <div class="field-row">
      <label for="pname">اسم المنتج</label>
      <input id="pname" matInput placeholder="اسم المنتج" />
    </div>
    <div class="field-row">
      <label for="price">السعر</label>
      <input id="price" matInput type="number" placeholder="0.00" />
    </div>
    <div class="field-row">
      <label for="image">صورة المنتج</label>
      <input id="image" type="file" />
    </div>
  </mat-card-content>
</mat-card>
