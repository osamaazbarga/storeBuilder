<mat-card class="step-card" style="text-align: right">
  <mat-card-header>
    <mat-card-title-group class="title">
      <mat-card-title aria-level="1">اكتشف باقات سلة</mat-card-title>
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-content>
    <div class="plans">
      <div class="plan" *ngFor="let p of plans">
        <div class="plan-head">{{ p.name }}</div>
        <div class="plan-price">{{ p.price }}</div>
        <ul>
          <li *ngFor="let f of p.features">{{ f }}</li>
        </ul>
        <button class="btn">اختر الباقة</button>
      </div>
    </div>
  </mat-card-content>
</mat-card>
