<mat-card class="step-card" style="text-align: right">
  <mat-card-header>
    <mat-card-title-group class="title">
      <mat-card-title aria-level="1">اختر تصميم متجرك</mat-card-title>
      <mat-card-subtitle aria-level="2">اختر القالب لواجهة المتجر</mat-card-subtitle>
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-content>
    <div class="themes-grid">
      <button mat-button class="theme-card" *ngFor="let t of themes" [class.active]="t.id === selected" (click)="select(t.id)">
        <div class="thumb"></div>
        <div class="name">{{ t.name }}</div>
      </button>
    </div>
  </mat-card-content>
</mat-card>
