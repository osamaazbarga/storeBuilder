<section class="content-area" dir="rtl">
    <header class="page-header">
      <h1 class="title">فعل المدفوعات الإلكترونية</h1>
      <p class="subtitle">على متجرك يمكنك تفعيل وسائل الدفع المتاحة. يمكنك تغييرها لاحقًا من الإعدادات.</p>
    </header>

    <ul class="payments-list">
      <li class="payment-item" *ngFor="let m of methods">
        <label class="switch">
          <input type="checkbox" />
          <span class="slider"></span>
        </label>
        <span class="payment-label">{{ m.label }}</span>
      </li>
    </ul>

    <div class="actions">
      <button class="btn-secondary" (click)="back()">السابق</button>
      <button class="btn-primary" (click)="next()">التالي</button>
    </div>
  </section>
