<!-- Mobile Overlay -->
<div class="sidebar-overlay"
     [class.show]="isMobileSidebarOpen"
     (click)="onOverlayClick()"
     (keydown)="onEscapeKey($event)"
     tabindex="-1"></div>

<!-- Main Sidebar -->
<aside class="dashboard-sidebar"
       [class.rtl]="isRTL"
       [class.ltr]="!isRTL"
       [class.show]="isMobileSidebarOpen"
       [class.collapsed]="isCollapsed"
       id="sidenav-main"
       (keydown)="onEscapeKey($event)"
       tabindex="-1">
  
  <!-- Sidebar Header -->
  <div class="sidebar-header">
    <!-- Collapse Button (Desktop) -->
    <button class="collapse-btn d-none d-lg-block"
            (click)="toggleCollapse()"
            [attr.aria-label]="isCollapsed ? ('SIDEBAR.EXPAND' | translate) : ('SIDEBAR.COLLAPSE' | translate)"
            type="button">
      <i class="material-symbols-rounded">
        {{ isCollapsed ? (isRTL ? 'keyboard_arrow_left' : 'keyboard_arrow_right') : (isRTL ? 'keyboard_arrow_right' : 'keyboard_arrow_left') }}
      </i>
    </button>

    <!-- Close Button (Mobile) -->
    <button class="close-btn d-lg-none"
            (click)="closeMobileSidebar()"
            [attr.aria-label]="'NAVBAR.CLOSE_MENU' | translate"
            type="button">
      <i class="material-symbols-rounded">close</i>
    </button>

    <!-- Logo -->
    <div class="logo-container" *ngIf="!isCollapsed">
      <img src="./assets/images/redLogoHovered.png"
           class="logo-img"
           height="32"
           alt="Dokan Logo">
    </div>

    <!-- Store Info -->
    <div class="store-info" *ngIf="storeData && !isCollapsed">
      <div class="store-avatar">
        <img [src]="storeData?.logo || defaultLogo"
             [alt]="storeData?.name"
             class="store-img">
      </div>
      <div class="store-details">
        <h3 class="store-name">{{ storeData?.name }}</h3>
        <a class="visit-store-link" (click)="routerLink()" type="button">
          <span>{{ 'SIDEBAR.VISIT_STORE' | translate }}</span>
          <i class="material-symbols-rounded">open_in_new</i>
        </a>
      </div>
    </div>

    <!-- Store Info Collapsed -->
    <div class="store-info-collapsed" *ngIf="storeData && isCollapsed">
      <img [src]="storeData?.logo || defaultLogo"
           [alt]="storeData?.name"
           class="store-img-small">
    </div>
  </div>

  <!-- Divider -->
  <hr class="sidebar-divider">

  <!-- Navigation Items -->
  <nav class="sidebar-nav">
    <ul class="nav-list">
      <li *ngFor="let item of itemList" class="nav-item">
        <!-- Section Header -->
        <div *ngIf="item.kind === 'main'" class="nav-section-header">
          <span *ngIf="!isCollapsed">{{ item.labelKey | translate }}</span>
          <span *ngIf="isCollapsed" class="section-dot"></span>
        </div>

        <!-- Navigation Link -->
        <a *ngIf="!item.kind && item.route"
           [routerLink]="item.route"
           class="nav-link"
           [class.active]="isRouteActive(item.route)"
           (click)="navigateTo(item.route)">
          <i class="material-symbols-rounded nav-icon">{{ item.icon }}</i>
          <span *ngIf="!isCollapsed" class="nav-text">{{ item.labelKey | translate }}</span>
          <div *ngIf="isRouteActive(item.route)" class="active-indicator"></div>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Sidebar Footer -->
  <div class="sidebar-footer" *ngIf="!isCollapsed">
    <div class="footer-content">
      <p class="footer-text">{{ 'DASHBOARD.HOME' | translate }}</p>
      <span class="footer-version">v1.0.0</span>
    </div>
  </div>
</aside>
