<div class="form-section" [formGroup]="productForm">
  <h3>{{ 'PRODUCTS.SHIPPING' | translate }}</h3>
  
  <div class="shipping-options">
    <div class="radio-group">
      <div class="radio-item">
        <input type="radio" id="noShipping" name="shippingRequired" value="no" formControlName="shippingRequired" class="form-check-input">
        <label for="noShipping">{{ 'PRODUCTS.DOES_NOT_REQUIRE_SHIPPING' | translate }}</label>
      </div>
      <div class="radio-item">
        <input type="radio" id="requiresShipping" name="shippingRequired" value="yes" formControlName="shippingRequired" class="form-check-input">
        <label for="requiresShipping">{{ 'PRODUCTS.REQUIRES_SHIPPING' | translate }}</label>
      </div>
    </div>
  </div>

  <div class="form-row" *ngIf="productForm.get('shippingRequired')?.value === 'yes'">
    <div class="form-group">
      <label for="weightType">{{ 'PRODUCTS.WEIGHT_TYPE' | translate }}</label>
      <select 
        id="weightType"
        formControlName="weightType" 
        class="form-control"
      >
        <option value="">{{ 'PRODUCTS.SELECT_WEIGHT_TYPE' | translate }}</option>
        <option value="kg">كيلوغرام</option>
        <option value="g">غرام</option>
        <option value="lb">باوند</option>
      </select>
    </div>

    <div class="form-group">
      <label for="weight">{{ 'PRODUCTS.PRODUCT_WEIGHT' | translate }}</label>
      <input 
        type="number" 
        id="weight"
        formControlName="weight" 
        class="form-control" 
        placeholder="0.00"
        step="0.01"
        min="0"
      />
    </div>
  </div>
</div>
