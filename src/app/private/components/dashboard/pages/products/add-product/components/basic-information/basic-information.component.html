<div class="form-section" [formGroup]="productForm">
  <h3>{{ 'PRODUCTS.BASIC_INFORMATION' | translate }}</h3>
  
  <!-- Image Upload Area -->
  <div class="image-upload-area">
    <div class="upload-box" (click)="onUploadBoxClick()">
      <i class="pi pi-camera"></i>
      <p>{{ 'PRODUCTS.UPLOAD_IMAGE_TEXT' | translate }}</p>
      <small>{{ 'PRODUCTS.UPLOAD_IMAGE_SUBTEXT' | translate }}</small>
    </div>
    <input 
      type="file" 
      multiple 
      accept="image/*" 
      (change)="onFileSelect($event)"
      class="file-input"
      id="imageUpload"
    />
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="title">{{ 'PRODUCTS.PRODUCT_NAME' | translate }} *</label>
      <input 
        type="text" 
        id="title"
        formControlName="title" 
        class="form-control" 
        [class.is-invalid]="submitted && productForm.get('title')?.errors"
        placeholder="{{ 'PRODUCTS.PRODUCT_NAME_PLACEHOLDER' | translate }}"
      />
      <div class="invalid-feedback" *ngIf="submitted && productForm.get('title')?.errors">
        <span *ngIf="productForm.get('title')?.hasError('required')">
          {{ 'PRODUCTS.PRODUCT_NAME_REQUIRED' | translate }}
        </span>
      </div>
    </div>

    <div class="form-group">
      <label for="price">{{ 'PRODUCTS.PRICE' | translate }} *</label>
      <input 
        type="number" 
        id="price"
        formControlName="price" 
        class="form-control" 
        [class.is-invalid]="submitted && productForm.get('price')?.errors"
        placeholder="0.00"
        step="0.01"
      />
      <div class="invalid-feedback" *ngIf="submitted && productForm.get('price')?.errors">
        <span *ngIf="productForm.get('price')?.hasError('required')">
          {{ 'PRODUCTS.PRICE_REQUIRED' | translate }}
        </span>
      </div>
    </div>
  </div>

  <!-- Cost Price and Brand - Only for physical products -->
  <div class="form-row" *ngIf="productType !== 'bookings' && productType !== 'digital-product' && productType !== 'digital-card'">
    <div class="form-group">
      <label for="costPrice">{{ 'PRODUCTS.COST_PRICE' | translate }}</label>
      <input 
        type="number" 
        id="costPrice"
        formControlName="costPrice" 
        class="form-control" 
        placeholder="0.00"
        step="0.01"
      />
    </div>

    <div class="form-group">
      <label for="brand">{{ 'PRODUCTS.BRAND' | translate }}</label>
      <select 
        id="brand"
        formControlName="brand" 
        class="form-control"
      >
        <option value="">{{ 'PRODUCTS.SELECT_BRAND' | translate }}</option>
        <option value="brand1">{{ 'PRODUCTS.BRAND_1' | translate }}</option>
        <option value="brand2">{{ 'PRODUCTS.BRAND_2' | translate }}</option>
      </select>
    </div>
  </div>

  <!-- Categories - Only for physical products -->
  <div class="form-row" *ngIf="productType !== 'bookings' && productType !== 'digital-product' && productType !== 'digital-card'">
    <div class="form-group">
      <label for="category">{{ 'PRODUCTS.CATEGORIES' | translate }}</label>
      <div class="category-select-group">
        <select 
          id="category"
          formControlName="category" 
          class="form-control" 
          [class.is-invalid]="submitted && productForm.get('category')?.errors"
        >
          <option value="">{{ 'PRODUCTS.SELECT_CATEGORIES' | translate }}</option>
          <option value="electronics">{{ 'PRODUCTS.ELECTRONICS' | translate }}</option>
          <option value="clothing">{{ 'PRODUCTS.CLOTHING' | translate }}</option>
          <option value="home">{{ 'PRODUCTS.HOME' | translate }}</option>
          <option value="books">{{ 'PRODUCTS.BOOKS' | translate }}</option>
          <option value="sports">{{ 'PRODUCTS.SPORTS' | translate }}</option>
        </select>
        <button type="button" class="btn btn-outline-primary add-category-btn">
          + {{ 'PRODUCTS.NEW_CATEGORY' | translate }}
        </button>
      </div>
    </div>

    <div class="form-group">
      <label for="localCategory">{{ 'PRODUCTS.LOCAL_CATEGORY' | translate }}</label>
      <select 
        id="localCategory"
        formControlName="localCategory" 
        class="form-control"
      >
        <option value="">{{ 'PRODUCTS.SELECT_LOCAL_CATEGORY' | translate }}</option>
        <option value="local1">{{ 'PRODUCTS.LOCAL_CATEGORY_1' | translate }}</option>
        <option value="local2">{{ 'PRODUCTS.LOCAL_CATEGORY_2' | translate }}</option>
      </select>
    </div>
  </div>

  <!-- Special fields for bookings -->
  <div class="form-row" *ngIf="productType === 'bookings'">
    <div class="form-group">
      <label for="duration">{{ 'PRODUCTS.DURATION' | translate }} *</label>
      <input 
        type="text" 
        id="duration"
        formControlName="duration" 
        class="form-control" 
        placeholder="{{ 'PRODUCTS.DURATION_PLACEHOLDER' | translate }}"
      />
    </div>

    <div class="form-group">
      <label for="location">{{ 'PRODUCTS.LOCATION' | translate }} *</label>
      <input 
        type="text" 
        id="location"
        formControlName="location" 
        class="form-control" 
        placeholder="{{ 'PRODUCTS.LOCATION_PLACEHOLDER' | translate }}"
      />
    </div>
  </div>

  <!-- Special fields for digital products -->
  <div class="form-row" *ngIf="productType === 'digital-product'">
    <div class="form-group">
      <label for="downloadLimit">{{ 'PRODUCTS.DOWNLOAD_LIMIT' | translate }} *</label>
      <input 
        type="number" 
        id="downloadLimit"
        formControlName="downloadLimit" 
        class="form-control" 
        placeholder="0"
        min="0"
      />
    </div>

    <div class="form-group">
      <label for="expiryDate">{{ 'PRODUCTS.EXPIRY_DATE' | translate }} *</label>
      <input 
        type="date" 
        id="expiryDate"
        formControlName="expiryDate" 
        class="form-control"
      />
    </div>
  </div>

  <!-- Special fields for digital cards -->
  <div class="form-row" *ngIf="productType === 'digital-card'">
    <div class="form-group">
      <label for="cardType">{{ 'PRODUCTS.CARD_TYPE' | translate }} *</label>
      <select 
        id="cardType"
        formControlName="cardType" 
        class="form-control"
      >
        <option value="">{{ 'PRODUCTS.SELECT_CARD_TYPE' | translate }}</option>
        <option value="gift">{{ 'PRODUCTS.GIFT_CARD' | translate }}</option>
        <option value="prepaid">{{ 'PRODUCTS.PREPAID_CARD' | translate }}</option>
        <option value="subscription">{{ 'PRODUCTS.SUBSCRIPTION_CARD' | translate }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="cardValue">{{ 'PRODUCTS.CARD_VALUE' | translate }} *</label>
      <input 
        type="number" 
        id="cardValue"
        formControlName="cardValue" 
        class="form-control" 
        placeholder="0.00"
        step="0.01"
        min="0"
      />
    </div>
  </div>

  <!-- Special fields for food products -->
  <div class="form-row" *ngIf="productType === 'food-product'">
    <div class="form-group">
      <label for="expiryDate">{{ 'PRODUCTS.EXPIRY_DATE' | translate }} *</label>
      <input 
        type="date" 
        id="expiryDate"
        formControlName="expiryDate" 
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="ingredients">{{ 'PRODUCTS.INGREDIENTS' | translate }} *</label>
      <textarea 
        id="ingredients"
        formControlName="ingredients" 
        class="form-control" 
        placeholder="{{ 'PRODUCTS.INGREDIENTS_PLACEHOLDER' | translate }}"
        rows="3"
      ></textarea>
    </div>
  </div>

  <!-- Special fields for custom services -->
  <div class="form-row" *ngIf="productType === 'custom-service'">
    <div class="form-group">
      <label for="serviceType">{{ 'PRODUCTS.SERVICE_TYPE' | translate }} *</label>
      <select 
        id="serviceType"
        formControlName="serviceType" 
        class="form-control"
      >
        <option value="">{{ 'PRODUCTS.SELECT_SERVICE_TYPE' | translate }}</option>
        <option value="consultation">{{ 'PRODUCTS.CONSULTATION' | translate }}</option>
        <option value="design">{{ 'PRODUCTS.DESIGN' | translate }}</option>
        <option value="development">{{ 'PRODUCTS.DEVELOPMENT' | translate }}</option>
        <option value="maintenance">{{ 'PRODUCTS.MAINTENANCE' | translate }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="deliveryTime">{{ 'PRODUCTS.DELIVERY_TIME' | translate }} *</label>
      <input 
        type="text" 
        id="deliveryTime"
        formControlName="deliveryTime" 
        class="form-control" 
        placeholder="{{ 'PRODUCTS.DELIVERY_TIME_PLACEHOLDER' | translate }}"
      />
    </div>
  </div>

  <div class="form-group">
    <label for="description">{{ 'PRODUCTS.PRODUCT_DESCRIPTION' | translate }}</label>
    <div class="rich-text-editor">
      <div class="editor-toolbar">
        <button type="button" class="toolbar-btn" title="Bold"><i class="pi pi-bold"></i></button>
        <button type="button" class="toolbar-btn" title="Italic"><i class="pi pi-italic"></i></button>
        <button type="button" class="toolbar-btn" title="Underline"><i class="pi pi-underline"></i></button>
        <button type="button" class="toolbar-btn" title="List"><i class="pi pi-list"></i></button>
        <button type="button" class="toolbar-btn" title="Link"><i class="pi pi-link"></i></button>
        <button type="button" class="toolbar-btn" title="Image"><i class="pi pi-image"></i></button>
      </div>
      <textarea 
        id="description"
        formControlName="description" 
        class="form-control rich-textarea" 
        placeholder="{{ 'PRODUCTS.DESCRIPTION_PLACEHOLDER' | translate }}"
        rows="6"
      ></textarea>
    </div>
  </div>
</div>
