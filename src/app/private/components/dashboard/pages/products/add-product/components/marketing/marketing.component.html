<div class="form-section" [formGroup]="productForm">
  <h3>{{ 'PRODUCTS.MARKETING' | translate }}</h3>
  
  <div class="form-group">
    <label for="pageTitle">{{ 'PRODUCTS.PAGE_TITLE' | translate }}</label>
    <input 
      type="text" 
      id="pageTitle"
      formControlName="pageTitle" 
      class="form-control" 
      placeholder="{{ 'PRODUCTS.PAGE_TITLE_PLACEHOLDER' | translate }}"
    />
  </div>

  <div class="form-group">
    <label for="customLink">{{ 'PRODUCTS.CUSTOM_LINK' | translate }}</label>
    <input 
      type="text" 
      id="customLink"
      formControlName="customLink" 
      class="form-control" 
      placeholder="{{ 'PRODUCTS.CUSTOM_LINK_PLACEHOLDER' | translate }}"
    />
  </div>

  <div class="form-group">
    <label for="pageDescription">{{ 'PRODUCTS.PAGE_DESCRIPTION' | translate }}</label>
    <textarea 
      id="pageDescription"
      formControlName="pageDescription" 
      class="form-control" 
      placeholder="{{ 'PRODUCTS.PAGE_DESCRIPTION_PLACEHOLDER' | translate }}"
      rows="3"
    ></textarea>
  </div>
</div>
