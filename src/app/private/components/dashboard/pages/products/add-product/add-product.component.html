<div class="container">
  <!-- Header -->
  <div class="header-section">
    <div class="breadcrumb">
      <a routerLink="/dashboard/products" class="breadcrumb-link">
        <i class="pi pi-arrow-left"></i>
        {{ 'PRODUCTS.BACK_TO_PRODUCTS' | translate }}
      </a>
    </div>
    <div class="product-type-info" *ngIf="productTypeConfig">
      <h2>{{ (productTypeConfig.title || 'PRODUCTS.ADD_PRODUCT') | translate }}</h2>
      <p>{{ 'PRODUCTS.BASIC_INFO_DESCRIPTION' | translate }}</p>
    </div>
  </div>

  <!-- Form -->
  <form [formGroup]="productForm" (ngSubmit)="onSubmit()" autocomplete="off" class="product-form">
    
    <!-- Basic Information Component - Always Show -->
    <app-basic-information 
      [productForm]="productForm" 
      [submitted]="submitted"
      [productType]="productType"
      (filesSelected)="selectFiles($event)">
    </app-basic-information>

    <!-- Advanced Information Component - Always Show -->
    <app-advanced-information 
      [productForm]="productForm" 
      [submitted]="submitted">
    </app-advanced-information>

    <!-- Quantity Management Component - For ready-product, custom-service, food-product -->
    <app-quantity-management 
      *ngIf="productType === 'ready-product' || productType === 'custom-service' || productType === 'food-product'"
      [productForm]="productForm" 
      [hasShipping]="productTypeConfig?.hasShipping || false">
    </app-quantity-management>

    <!-- Files Component - For digital-product, digital-card -->
    <app-files 
      *ngIf="productType === 'digital-product' || productType === 'digital-card'"
      [productForm]="productForm">
    </app-files>

    <!-- Product Bundle Component - For product-bundle only -->
    <app-product-bundle 
      *ngIf="productType === 'product-bundle'"
      [productForm]="productForm">
    </app-product-bundle>

    <!-- Booking Schedule Component - For bookings only -->
    <app-booking-schedule 
      *ngIf="productType === 'bookings'"
      [productForm]="productForm">
    </app-booking-schedule>

    <!-- Options Component - For ready-product, custom-service only -->
    <app-options 
      *ngIf="productType === 'ready-product' || productType === 'custom-service'">
    </app-options>

    <!-- Order Form Component - For custom-service, food-product, bookings -->
    <app-order-form 
      *ngIf="productType === 'custom-service' || productType === 'food-product' || productType === 'bookings'">
    </app-order-form>

    <!-- Custom Fields Component - Always Show -->
    <app-custom-fields></app-custom-fields>

    <!-- Notifications Component - For ready-product, custom-service, product-bundle, food-product -->
    <app-notifications 
      *ngIf="productType === 'ready-product' || productType === 'custom-service' || productType === 'product-bundle' || productType === 'food-product'"
      [productForm]="productForm">
    </app-notifications>

    <!-- Error Messages -->
    <div class="error-messages" *ngIf="errorMessages.length > 0">
      <div class="alert alert-danger" *ngFor="let error of errorMessages">
        {{ error }}
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" routerLink="/dashboard/products">
        {{ 'PRODUCTS.CANCEL' | translate }}
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="submitted && !productForm.valid">
        <i class="pi pi-save"></i>
        {{ 'PRODUCTS.SAVE_PRODUCT' | translate }}
      </button>
    </div>
  </form>
</div>

<!-- Footer -->
<div class="footer-promotion">
  <div class="promotion-content">
    <p>{{ 'PRODUCTS.PROMOTION_MESSAGE' | translate }}</p>
    <button type="button" class="btn btn-success">{{ 'PRODUCTS.START_STORE_FREE' | translate }}</button>
  </div>
</div>
