<div class="container">
  <!-- Header -->
  <div class="header-section">
    <div class="breadcrumb">
      <a routerLink="/dashboard/products" class="breadcrumb-link">
        <i class="pi pi-arrow-left"></i>
        {{ 'PRODUCTS.BACK_TO_PRODUCTS' | translate }}
      </a>
    </div>
    <div class="product-type-info" *ngIf="productTypeConfig">
      <h2>{{ (productTypeConfig.title || 'PRODUCTS.ADD_PRODUCT') | translate }}</h2>
      <p>{{ 'PRODUCTS.BASIC_INFO_DESCRIPTION' | translate }}</p>
    </div>
  </div>

  <!-- Form -->
  <form [formGroup]="productForm" (ngSubmit)="onSubmit()" autocomplete="off" class="product-form">
    
    <!-- Basic Information Component -->
    <app-basic-information 
      [productForm]="productForm" 
      [submitted]="submitted"
      (filesSelected)="selectFiles($event)">
    </app-basic-information>

    <!-- Advanced Information Component -->
    <app-advanced-information 
      [productForm]="productForm" 
      [submitted]="submitted">
    </app-advanced-information>

    <!-- Display Channels Component -->
    <app-display-channels 
      [productForm]="productForm" 
      [productType]="productType">
    </app-display-channels>

    <!-- Shipping Component -->
    <app-shipping 
      [productForm]="productForm" 
      [hasShipping]="productTypeConfig?.hasShipping || false">
    </app-shipping>

    <!-- Inventory Component -->
    <app-inventory 
      [productForm]="productForm" 
      [hasShipping]="productTypeConfig?.hasShipping || false">
    </app-inventory>

    <!-- Marketing Component -->
    <app-marketing [productForm]="productForm"></app-marketing>

    <!-- Quantity Management Component -->
    <app-quantity-management 
      [productForm]="productForm" 
      [hasShipping]="productTypeConfig?.hasShipping || false">
    </app-quantity-management>

    <!-- Options and Forms Component -->
    <app-options-forms></app-options-forms>

    <!-- Notifications Component -->
    <app-notifications [productForm]="productForm"></app-notifications>

    <!-- Error Messages -->
    <div class="error-messages" *ngIf="errorMessages.length > 0">
      <div class="alert alert-danger" *ngFor="let error of errorMessages">
        {{ error }}
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" routerLink="/dashboard/products">
        {{ 'PRODUCTS.CANCEL' | translate }}
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="submitted && !productForm.valid">
        <i class="pi pi-save"></i>
        {{ 'PRODUCTS.SAVE_PRODUCT' | translate }}
      </button>
    </div>
  </form>
</div>

<!-- Footer -->
<div class="footer-promotion">
  <div class="promotion-content">
    <p>{{ 'PRODUCTS.PROMOTION_MESSAGE' | translate }}</p>
    <button type="button" class="btn btn-success">{{ 'PRODUCTS.START_STORE_FREE' | translate }}</button>
  </div>
</div>
