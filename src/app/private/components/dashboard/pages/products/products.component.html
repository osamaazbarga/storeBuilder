<p-inputgroup>
    <p-inputgroup-addon>
        &#64;
    </p-inputgroup-addon>
    <input pInputText  placeholder="Title" />
    </p-inputgroup>

    <p-inputgroup>
        <p-inputgroup-addon><i class="pi pi-money-bill"></i></p-inputgroup-addon>
        <p-inputnumber placeholder="Price" />
        <p-inputgroup-addon>.00</p-inputgroup-addon>
    </p-inputgroup>

    <p-inputgroup class="w-full md:!w-[30rem]">
    <p-inputgroup-addon>
        <span class="material-symbols-rounded">
            production_quantity_limits
        </span>
    </p-inputgroup-addon>
    
    <input type="text" pInputText placeholder="Price" />
    <p-inputgroup-addon>
      <span class="material-symbols-rounded">
            notification_important
      </span>
    </p-inputgroup-addon>
    <p-inputgroup-addon>
      <span class="material-symbols-rounded">
            all_inclusive
      </span>
    </p-inputgroup-addon>

    <p-inputgroup-addon>
      <p-button severity="secondary" label="Search" data-bs-toggle="modal" data-bs-target="#staticBackdrop"/>
    </p-inputgroup-addon>
</p-inputgroup>

     <p-inputgroup>
        <p-inputgroup-addon class="buttonElement">

            <p-button severity="secondary" label="Search" data-bs-toggle="modal" data-bs-target="#staticBackdrop"/>
        </p-inputgroup-addon>
        <p-multiselect [attr.dir]="currentLang === 'ar' ||  currentLang === 'he'? 'rtl' : 'ltr'"
 id="categorySelect" class="form-select"
  [options]="cities" [(ngModel)]="selectedCities" placeholder="Select Cities" optionLabel="name" display="chip" />
    </p-inputgroup>

    <p-inputgroup class="buttonGroup">
    <p-inputgroup-addon class="buttonElement">

            <p-button icon="pi pi-sliders-h" severity="secondary" [iconPos]="currentLang === 'ar' ||  currentLang === 'he'? 'right' : 'left'" label="Product Settings" data-bs-toggle="modal" data-bs-target="#staticBackdrop"/>
        </p-inputgroup-addon>
        <p-inputgroup-addon class="buttonElement">

            <!-- <p-button severity="secondary" label="More" data-bs-toggle="modal" data-bs-target="#staticBackdrop"/> -->
            <p-splitbutton severity="secondary" label="More" [model]="items" />

        </p-inputgroup-addon>
</p-inputgroup>
