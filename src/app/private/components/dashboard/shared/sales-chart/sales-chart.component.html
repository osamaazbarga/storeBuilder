<div class="card h-100">
  <div class="card-header pb-0">
    <div class="row">
      <div class="col-lg-6 col-7">
        <h6 class="chart-title">{{ title | translate }}</h6>
        <p class="text-sm mb-0">
          <i class="fa fa-check text-info" aria-hidden="true"></i>
          <span class="font-weight-bold ms-1">{{ 'DASHBOARD.UPDATED_RECENTLY' | translate }}</span>
        </p>
      </div>
      <div class="col-lg-6 col-5 my-auto text-end">
        <div class="dropdown float-end pe-4">
          <a class="cursor-pointer" id="dropdownTable" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fa fa-ellipsis-v text-secondary"></i>
          </a>
          <ul class="dropdown-menu px-2 py-3 ms-sm-n4 ms-n5" aria-labelledby="dropdownTable">
            <li><a class="dropdown-item border-radius-md" href="javascript:;">{{ 'DASHBOARD.VIEW_REPORT' | translate }}</a></li>
            <li><a class="dropdown-item border-radius-md" href="javascript:;">{{ 'DASHBOARD.EXPORT_DATA' | translate }}</a></li>
            <li><a class="dropdown-item border-radius-md" href="javascript:;">{{ 'DASHBOARD.REFRESH' | translate }}</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="card-body p-3">
    <div class="chart-container" [style.height.px]="height">
      <canvas #chartCanvas></canvas>
    </div>
  </div>
</div>
