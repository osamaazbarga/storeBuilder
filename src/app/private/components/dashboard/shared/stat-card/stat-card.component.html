<div class="card h-100">
  <div class="card-header mx-4 p-3 text-center">
    <div class="icon icon-shape icon-lg border-radius-lg text-center {{ getColorClass() }}">
      <i class="material-symbols-rounded opacity-10">{{ data.icon }}</i>
    </div>
  </div>
  <div class="card-body pt-0 p-3 text-center">
    <h6 class="text-center mb-0 card-title">{{ data.title | translate }}</h6>
    <span class="text-xs">{{ data.description}}</span>
    <hr class="horizontal dark my-3">
    <h5 class="mb-0 stat-value">{{ formatValue() }}</h5>
    
    <!-- Trend Indicator -->
    <div class="trend-indicator mt-2" *ngIf="data.percentage || data.trend">
      <span [class]="getTrendClass()" *ngIf="data.trend">
        <i class="material-symbols-rounded text-sm me-1">{{ getTrendIcon() }}</i>
      </span>
      <span class="text-sm" *ngIf="data.percentage">
        <span [class]="getTrendClass()" *ngIf="data.trend">{{ data.percentage }}%</span>
        <span class="text-secondary ms-1">{{ 'DASHBOARD.SINCE_LAST_MONTH' | translate }}</span>
      </span>
    </div>
  </div>
</div>
