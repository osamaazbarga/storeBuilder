<div class="d-flex justify-content-center">
    <!-- <div>
        <div class="login">
            <a [routerLink]="['/login']">Go TO Login</a>
        </div> -->

        <div class="col-12">
            <main class="form-signin">

                <!-- <mat-card-content> -->
                    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" autocomplete="off">
                        <label for="firstname">{{ 'FULLNAME' | translate }}</label>
                        <div class="">
                            <input type="text" placeholder="{{ 'ENTERFULLNAME' | translate }}" formControlName="firstname" class="form-control" 
                            [class.is-invalid]="submitted &&registerForm.get('firstname')?.errors">
                            
                            <span class="text-danger" *ngIf=" registerForm.get('firstname')?.hasError('required')">
                                First Name is required
                            </span>
                            <!-- <mat-error *ngIf="email.touched&&email.hasError('required')">Email is required</mat-error>
                            <mat-error *ngIf="email.touched&&email.hasError('email')">Email must be valid</mat-error> -->

                        </div>

                        <div class="">
                            <label for="email">{{ 'EMAIL' | translate }}</label>
                            <input type="email" placeholder="{{ 'ENTEREMAIL' | translate }}" formControlName="email" class="form-control" 
                            [class.is-invalid]="submitted &&registerForm.get('email')?.errors">
                            <span class="text-danger" *ngIf=" submitted && registerForm.get('email')?.hasError('required')">
                                Email is required
                            </span>
                            <span class="text-danger" *ngIf=" registerForm.get('email')?.hasError('pattern')">
                                Invalid email address
                            </span>
                            <!-- <mat-error *ngIf="email.touched&&email.hasError('required')">Email is required</mat-error>
                            <mat-error *ngIf="email.touched&&email.hasError('email')">Email must be valid</mat-error> -->

                        </div>

                        <div class="">
                            <label for="phone">{{ 'PHONE' | translate }}</label>
                            <input type="text" placeholder="{{ 'ENTERPHONE' | translate }}" formControlName="phone" class="form-control" 
                            [class.is-invalid]="submitted &&registerForm.get('phone')?.errors">
                            <span class="text-danger" *ngIf=" registerForm.get('phone')?.hasError('required')">
                                Phone Number is required
                            </span>
                            <!-- <mat-error *ngIf="email.touched&&email.hasError('required')">Email is required</mat-error>
                            <mat-error *ngIf="email.touched&&email.hasError('email')">Email must be valid</mat-error> -->

                        </div>
                        <div class="">
                            <label for="password">{{ 'PASSWORD' | translate }}</label>
                            <input type="password" placeholder="{{ 'ENTERPASSWORD' | translate }}" formControlName="password" class="form-control"
                            [class.is-invalid]="submitted &&registerForm.get('password')?.errors">
                            <!-- <mat-error *ngIf="password.touched&&password.hasError('required')">Password is required</mat-error> -->
                            <span class="text-danger" *ngIf="registerForm.get('password')?.hasError('required')">
                                Password is required
                            </span>
                            <span class="text-danger" *ngIf=" submitted && registerForm.get('password')?.hasError('minLength')&&registerForm.get('password')?.hasError('maxLength')">
                                password must be at least 6 ,and maximum 15 characters
                            </span>
                        </div>
                        <div class="">
                            <label for="passwordConfirm">{{ 'CONFIRMPASSWORD' | translate }}</label>
                            <input type="password" placeholder="{{ 'ENTERCONFIRMPASSWORD' | translate }}" formControlName="passwordConfirm" class="form-control"
                            [class.is-invalid]="submitted &&registerForm.get('passwordConfirm')?.errors">
                            <span class="text-danger" *ngIf=" registerForm.get('passwordConfirm')?.hasError('required')">
                                Password Confirm is required
                            </span>
                            <span class="text-danger" *ngIf=" registerForm.get('passwordConfirm')?.hasError('minlength')&&registerForm.get('passwordConfirm')?.hasError('maxlength')">
                                password must be at least 6 ,and maximum 15 characters
                            </span>
                        </div>
                       <div class="form-floating" *ngIf="errorMessages.length>0">
                        <app-validation-messages [errorMessages]="errorMessages">

                        </app-validation-messages>
                    </div>
                        <!-- <mat-error *ngIf="passwordConfirm.touched&&registerForm.hasError('passwordNotMatching')">Password not matching</mat-error> -->
                        <div class="d-grid mt-4 px-1">
                            <button class="btn btn-lg btn-sign" type="submit">
                                {{ 'SIGNUP' | translate }}
                            </button>

                        </div>
                        
                    </form>
                    <div class="row d-flex justify-content-center mt-3">
                        <div class="col-4">
                            <hr>
                        </div>
                        <div class="col-4 text-center">Or signup using</div>
                        <div class="col-4">
                            <hr>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between my-3">
                        <div #googleButton>
                            
                        </div>
                        <button style="width: 180px;" class="btn btn-primary btn-sm" (click)="registerWithFacebook()">Facebook</button>
                        
                    </div>

                    
                <!-- </mat-card-content> -->
            </main>
        </div>
    <!-- </div> -->
</div>
