


<div class="d-flex justify-content-center">
    <div class="col-12">
        <main class="form-signin">
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off">
                <label for="email">{{ 'EMAIL' | translate }}</label>
                <div class="">
                    <input formControlName="userName" type="text" placeholder="{{ 'ENTEREMAIL' | translate }}" class="form-control"
                    [class.is-invalid]="submitted &&loginForm.get('userName')?.errors">
                    <span class="text-danger" *ngIf=" submitted && loginForm.get('userName')?.hasError('required')">
                        Email is required
                    </span>
                </div>
                <label for="password">{{ 'PASSWORD' | translate }}</label>
                <div class="">
                    <input formControlName="password" type="password" placeholder="{{ 'ENTERPASSWORD' | translate }}" class="form-control"
                    [class.is-invalid]="submitted &&loginForm.get('password')?.errors">
                    <span class="text-danger" *ngIf=" submitted && loginForm.get('password')?.hasError('required')">
                        Password is required
                    </span>
                </div>
                <div class="form-floating" *ngIf="errorMessages.length>0">
                    <app-validation-messages [errorMessages]="errorMessages">

                    </app-validation-messages>
                    <a class="btn btn-link" (click)="resendEmailConfirmationLink()" *ngIf="errorMessages[0].includes('Please confirm your email')">
                        Click here to resend email confirmation link in case you didn't receive it 
                    </a>
                </div>

                <div class="d-grid mt-4 px-1">
                    <button class="btn btn-lg btn-sign" type="submit">{{ 'LOGIN' | translate }}</button>
                </div>
            </form>

            <div class="mt-4 text-center">
                <a class="link-secondary btn btn-link link-offset-2 link-underline link-underline-opacity-0" routerLink="/sendEmail/forgotpassword">
                    <h6>{{ 'FORETPASSWORD' | translate }}</h6>
                </a>
            </div>
            <div class="row d-flex justify-content-center mt-3">
                <div class="col-4">
                    <hr>
                </div>
                <div class="col-4 text-center">Or login using</div>
                <div class="col-4">
                    <hr>
                </div>
            </div>
            <div class="d-flex justify-content-between my-3">
                <div #googleButton>
                            
                </div>
                <button style="width: 180px;" class="btn btn-primary btn-sm" (click)="loginWithFacebook()">Facebook</button>
                
            </div>

        </main>
    </div>
</div>
